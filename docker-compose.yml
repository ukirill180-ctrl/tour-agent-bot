version: "3.8"

services:
  tour-agent:
    build: .
    container_name: tour_agent_ai
    env_file: .env
    volumes:
      - ./knowledge:/app/knowledge
      - ./cases:/app/cases
      - ./data:/app/data
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data:
